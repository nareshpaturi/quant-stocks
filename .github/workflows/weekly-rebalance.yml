name: Weekly Portfolio Rebalance

# ── How to configure this workflow after forking ──────────────────────────────
#
# This workflow reads all configuration from the PROD GitHub Environment.
# Go to your fork → Settings → Environments → New environment → name it "PROD"
# then add the variables and secrets listed below inside that environment.
#
# VARIABLES (non-sensitive, visible in logs) — add under PROD environment:
#   PROFILE_COUNT             Number of index profiles to run (e.g. "2")
#
#   PROFILE_1_NAME                  Human label  (e.g. "SP500 Momentum")
#   PROFILE_1_INDEX                 Index key: sp500 | sp400 | sp600 | ndx
#   PROFILE_1_MAX_STOCKS            Target portfolio size (e.g. "25")
#   PROFILE_1_SLACK_VALUE           Retention buffer     (e.g. "5")
#   PROFILE_1_INITIAL_AMOUNT_PER_STOCK  Dollar amount per organic buy slot (e.g. "5000")
#
#   Repeat PROFILE_2_*, PROFILE_3_*, ... up to PROFILE_5_* as needed.
#
# SECRETS (sensitive, never shown in logs) — add under PROD environment:
#   RANKING_API_TOKEN             QuantMyStocks API Bearer token (shared by all profiles)
#
#   PROFILE_1_TRADIER_TOKEN       Tradier Bearer token for profile 1  (live account)
#   PROFILE_1_TRADIER_ACCOUNT_ID  Tradier account number for profile 1 (live account)
#
#   Repeat PROFILE_2_*, PROFILE_3_*, ... up to PROFILE_5_* as needed.
#
# ── Email notifications (optional) ────────────────────────────────────────────
# Add these secrets to the PROD environment to receive the summary by email.
# If any of these are absent the email step is simply skipped.
#
#   SMTP_SERVER     SMTP host, e.g. smtp.gmail.com
#   SMTP_USERNAME   Login address, e.g. you@gmail.com
#   SMTP_PASSWORD   App password (Gmail: Account → Security → App passwords)
#   NOTIFY_EMAIL    Recipient address, e.g. you@gmail.com
#
# Rankings are fetched automatically from the QuantMyStocks leaderboard API —
# no CSV files or data preparation required.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # ── Monday ────────────────────────────────────────────────────────────────
    # 08:30 UTC = 3:30 AM ET  — 30 min before pre-market opens; places GTC
    #                           orders so they are ready when trading starts.
    - cron: "30 8 * * 1"
    # 09:05 UTC = 4:05 AM ET  — 5 min after pre-market opens (4:00 AM ET).
    - cron: "5 9 * * 1"
    # 14:35 UTC = 9:35 AM ET  — 5 min after regular market opens (9:30 AM ET).
    - cron: "35 14 * * 1"
    # ── Tuesday – Friday ──────────────────────────────────────────────────────
    # Same pre-market and market-open slots on other weekdays so that any
    # GTC orders not yet filled (or new rebalance signals) are handled.
    # 09:05 UTC = 4:05 AM ET  — pre-market open.
    - cron: "5 9 * * 2-5"
    # 14:35 UTC = 9:35 AM ET  — regular market open.
    - cron: "35 14 * * 2-5"
  workflow_dispatch: # Manual trigger.

permissions:
  contents: read

concurrency:
  group: rebalance-prod
  cancel-in-progress: false

jobs:
  rebalance:
    name: Rebalance all profiles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: PROD

    env:
      # ── Rankings API (shared across all profiles) ────────────────────────────
      RANKING_API_TOKEN: ${{ secrets.RANKING_API_TOKEN }}

      # ── Email notifications (optional — skip step if secrets are absent) ─────
      SMTP_SERVER:    ${{ secrets.SMTP_SERVER }}
      SMTP_USERNAME:  ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD:  ${{ secrets.SMTP_PASSWORD }}
      NOTIFY_EMAIL:   ${{ secrets.NOTIFY_EMAIL }}

      # ── Profile count ───────────────────────────────────────────────────────
      PROFILE_COUNT: ${{ vars.PROFILE_COUNT }}

      # ── Profile 1 ───────────────────────────────────────────────────────────
      PROFILE_1_NAME:                    ${{ vars.PROFILE_1_NAME }}
      PROFILE_1_INDEX:                   ${{ vars.PROFILE_1_INDEX }}
      PROFILE_1_MAX_STOCKS:              ${{ vars.PROFILE_1_MAX_STOCKS }}
      PROFILE_1_SLACK_VALUE:             ${{ vars.PROFILE_1_SLACK_VALUE }}
      PROFILE_1_INITIAL_AMOUNT_PER_STOCK: ${{ vars.PROFILE_1_INITIAL_AMOUNT_PER_STOCK }}
      PROFILE_1_TRADIER_TOKEN:           ${{ secrets.PROFILE_1_TRADIER_TOKEN }}
      PROFILE_1_TRADIER_ACCOUNT_ID:      ${{ secrets.PROFILE_1_TRADIER_ACCOUNT_ID }}

      # ── Profile 2 ───────────────────────────────────────────────────────────
      PROFILE_2_NAME:                    ${{ vars.PROFILE_2_NAME }}
      PROFILE_2_INDEX:                   ${{ vars.PROFILE_2_INDEX }}
      PROFILE_2_MAX_STOCKS:              ${{ vars.PROFILE_2_MAX_STOCKS }}
      PROFILE_2_SLACK_VALUE:             ${{ vars.PROFILE_2_SLACK_VALUE }}
      PROFILE_2_INITIAL_AMOUNT_PER_STOCK: ${{ vars.PROFILE_2_INITIAL_AMOUNT_PER_STOCK }}
      PROFILE_2_TRADIER_TOKEN:           ${{ secrets.PROFILE_2_TRADIER_TOKEN }}
      PROFILE_2_TRADIER_ACCOUNT_ID:      ${{ secrets.PROFILE_2_TRADIER_ACCOUNT_ID }}

      # ── Profile 3 ───────────────────────────────────────────────────────────
      PROFILE_3_NAME:                    ${{ vars.PROFILE_3_NAME }}
      PROFILE_3_INDEX:                   ${{ vars.PROFILE_3_INDEX }}
      PROFILE_3_MAX_STOCKS:              ${{ vars.PROFILE_3_MAX_STOCKS }}
      PROFILE_3_SLACK_VALUE:             ${{ vars.PROFILE_3_SLACK_VALUE }}
      PROFILE_3_INITIAL_AMOUNT_PER_STOCK: ${{ vars.PROFILE_3_INITIAL_AMOUNT_PER_STOCK }}
      PROFILE_3_TRADIER_TOKEN:           ${{ secrets.PROFILE_3_TRADIER_TOKEN }}
      PROFILE_3_TRADIER_ACCOUNT_ID:      ${{ secrets.PROFILE_3_TRADIER_ACCOUNT_ID }}

      # ── Profile 4 ───────────────────────────────────────────────────────────
      PROFILE_4_NAME:                    ${{ vars.PROFILE_4_NAME }}
      PROFILE_4_INDEX:                   ${{ vars.PROFILE_4_INDEX }}
      PROFILE_4_MAX_STOCKS:              ${{ vars.PROFILE_4_MAX_STOCKS }}
      PROFILE_4_SLACK_VALUE:             ${{ vars.PROFILE_4_SLACK_VALUE }}
      PROFILE_4_INITIAL_AMOUNT_PER_STOCK: ${{ vars.PROFILE_4_INITIAL_AMOUNT_PER_STOCK }}
      PROFILE_4_TRADIER_TOKEN:           ${{ secrets.PROFILE_4_TRADIER_TOKEN }}
      PROFILE_4_TRADIER_ACCOUNT_ID:      ${{ secrets.PROFILE_4_TRADIER_ACCOUNT_ID }}

      # ── Profile 5 ───────────────────────────────────────────────────────────
      PROFILE_5_NAME:                    ${{ vars.PROFILE_5_NAME }}
      PROFILE_5_INDEX:                   ${{ vars.PROFILE_5_INDEX }}
      PROFILE_5_MAX_STOCKS:              ${{ vars.PROFILE_5_MAX_STOCKS }}
      PROFILE_5_SLACK_VALUE:             ${{ vars.PROFILE_5_SLACK_VALUE }}
      PROFILE_5_INITIAL_AMOUNT_PER_STOCK: ${{ vars.PROFILE_5_INITIAL_AMOUNT_PER_STOCK }}
      PROFILE_5_TRADIER_TOKEN:           ${{ secrets.PROFILE_5_TRADIER_TOKEN }}
      PROFILE_5_TRADIER_ACCOUNT_ID:      ${{ secrets.PROFILE_5_TRADIER_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      # Domain tests gate all real orders — failures abort the run here.
      - name: Run domain unit tests
        run: go test ./internal/domain/... -v -count=1

      - name: Build rebalancer binary
        run: go build -o rebalancer ./cmd/rebalancer

      - name: Rebalance all profiles
        run: ./rebalancer | tee /tmp/summary.txt

      - name: Post job summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Send summary email
        if: always() && env.SMTP_SERVER != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: 587
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          to: ${{ env.NOTIFY_EMAIL }}
          from: GitHub Actions <${{ env.SMTP_USERNAME }}>
          subject: "[quant-stocks] Weekly Rebalance — ${{ github.run_number }}"
          body: file:///tmp/summary.txt
