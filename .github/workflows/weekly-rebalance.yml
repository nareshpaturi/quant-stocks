name: Weekly Portfolio Rebalance

# ── How to configure this workflow after forking ──────────────────────────────
#
# This workflow reads all configuration from the PROD GitHub Environment.
# Go to your fork → Settings → Environments → New environment → name it "PROD"
# then add the variables and secrets listed below inside that environment.
#
# VARIABLES (non-sensitive, visible in logs) — add under PROD environment:
#   PROFILE_COUNT             Number of index profiles to run (e.g. "2")
#
#   PROFILE_1_NAME                  Human label  (e.g. "SP500 Momentum")
#   PROFILE_1_INDEX                 Index key: sp500 | sp400 | sp600 | ndx
#   PROFILE_1_MAX_STOCKS            Target portfolio size (e.g. "25")
#   PROFILE_1_SLACK_VALUE           Retention buffer     (e.g. "5")
#   PROFILE_1_INITIAL_AMOUNT_PER_STOCK  Dollar amount per organic buy slot (e.g. "5000")
#   PROFILE_1_BROKER_TYPE          tradier | robinhood | mock
#   PROFILE_1_ROBINHOOD_ACCOUNT_ID Dedicated Agentic account id (Robinhood only)
#   PROFILE_1_ROBINHOOD_MODE       read-only | shadow | review | live
#   PROFILE_1_ROBINHOOD_LIVE_TRADING  false until canary validation is complete
#   ROBINHOOD_SECRET_WRITER_APP_ID Repository-scoped GitHub App id
#
#   Repeat PROFILE_2_*, PROFILE_3_*, ... up to PROFILE_5_* as needed.
#
# SECRETS (sensitive, never shown in logs) — add under PROD environment:
#   RANKING_API_TOKEN             QuantMyStocks API Bearer token (shared by all profiles)
#
#   PROFILE_1_TRADIER_TOKEN       Tradier Bearer token for profile 1  (live account)
#   PROFILE_1_TRADIER_ACCOUNT_ID  Tradier account number for profile 1 (live account)
#   PROFILE_1_ROBINHOOD_OAUTH_STATE  Complete OAuth state bundle (Robinhood only)
#   ROBINHOOD_SECRET_WRITER_PRIVATE_KEY  GitHub App key for OAuth rotation write-back
#
#   Repeat PROFILE_2_*, PROFILE_3_*, ... up to PROFILE_5_* as needed.
#
# ── Email notifications (optional) ────────────────────────────────────────────
# Add these secrets to the PROD environment to receive the summary by email.
# If any of these are absent the email step is simply skipped.
#
#   SMTP_SERVER     SMTP host, e.g. smtp.gmail.com
#   SMTP_USERNAME   Login address, e.g. you@gmail.com
#   SMTP_PASSWORD   App password (Gmail: Account → Security → App passwords)
#   NOTIFY_EMAIL    Recipient address, e.g. you@gmail.com
#
# Rankings are fetched automatically from the QuantMyStocks leaderboard API —
# no CSV files or data preparation required.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    # ── Monday ────────────────────────────────────────────────────────────────
    # Repeated UTC slots let broker reconciliation converge as orders fill.
    - cron: "30 8 * * 1"
    - cron: "5 9 * * 1"
    - cron: "35 14 * * 1"
    # ── Tuesday – Friday ──────────────────────────────────────────────────────
    # Continue reconciling pending, filled, and terminal broker outcomes.
    - cron: "5 9 * * 2-5"
    - cron: "35 14 * * 2-5"
  workflow_dispatch: # Manual trigger.

permissions:
  contents: read

concurrency:
  group: rebalance-prod
  cancel-in-progress: false

jobs:
  rebalance:
    name: Rebalance all profiles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: PROD

    env:
      # ── Rankings API (shared across all profiles) ────────────────────────────
      RANKING_API_TOKEN: ${{ secrets.RANKING_API_TOKEN }}

      # ── Email notifications (optional — skip step if secrets are absent) ─────
      SMTP_SERVER:    ${{ secrets.SMTP_SERVER }}
      SMTP_USERNAME:  ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD:  ${{ secrets.SMTP_PASSWORD }}
      NOTIFY_EMAIL:   ${{ secrets.NOTIFY_EMAIL }}

      # ── Profile count ───────────────────────────────────────────────────────
      PROFILE_COUNT: ${{ vars.PROFILE_COUNT }}

      # ── Profile 1 ───────────────────────────────────────────────────────────
      PROFILE_1_NAME:                    ${{ vars.PROFILE_1_NAME }}
      PROFILE_1_INDEX:                   ${{ vars.PROFILE_1_INDEX }}
      PROFILE_1_MAX_STOCKS:              ${{ vars.PROFILE_1_MAX_STOCKS }}
      PROFILE_1_SLACK_VALUE:             ${{ vars.PROFILE_1_SLACK_VALUE }}
      PROFILE_1_INITIAL_AMOUNT_PER_STOCK: ${{ vars.PROFILE_1_INITIAL_AMOUNT_PER_STOCK }}
      PROFILE_1_BROKER_TYPE:              ${{ vars.PROFILE_1_BROKER_TYPE }}
      PROFILE_1_TRADIER_TOKEN:           ${{ secrets.PROFILE_1_TRADIER_TOKEN }}
      PROFILE_1_TRADIER_ACCOUNT_ID:      ${{ secrets.PROFILE_1_TRADIER_ACCOUNT_ID }}
      PROFILE_1_ROBINHOOD_ACCOUNT_ID:       ${{ vars.PROFILE_1_ROBINHOOD_ACCOUNT_ID }}
      PROFILE_1_ROBINHOOD_MCP_URL:          ${{ vars.PROFILE_1_ROBINHOOD_MCP_URL }}
      PROFILE_1_ROBINHOOD_MODE:             ${{ vars.PROFILE_1_ROBINHOOD_MODE }}
      PROFILE_1_ROBINHOOD_LIVE_TRADING:     ${{ vars.PROFILE_1_ROBINHOOD_LIVE_TRADING }}

      # ── Profile 2 ───────────────────────────────────────────────────────────
      PROFILE_2_NAME:                    ${{ vars.PROFILE_2_NAME }}
      PROFILE_2_INDEX:                   ${{ vars.PROFILE_2_INDEX }}
      PROFILE_2_MAX_STOCKS:              ${{ vars.PROFILE_2_MAX_STOCKS }}
      PROFILE_2_SLACK_VALUE:             ${{ vars.PROFILE_2_SLACK_VALUE }}
      PROFILE_2_INITIAL_AMOUNT_PER_STOCK: ${{ vars.PROFILE_2_INITIAL_AMOUNT_PER_STOCK }}
      PROFILE_2_BROKER_TYPE:              ${{ vars.PROFILE_2_BROKER_TYPE }}
      PROFILE_2_TRADIER_TOKEN:           ${{ secrets.PROFILE_2_TRADIER_TOKEN }}
      PROFILE_2_TRADIER_ACCOUNT_ID:      ${{ secrets.PROFILE_2_TRADIER_ACCOUNT_ID }}
      PROFILE_2_ROBINHOOD_ACCOUNT_ID:       ${{ vars.PROFILE_2_ROBINHOOD_ACCOUNT_ID }}
      PROFILE_2_ROBINHOOD_MCP_URL:          ${{ vars.PROFILE_2_ROBINHOOD_MCP_URL }}
      PROFILE_2_ROBINHOOD_MODE:             ${{ vars.PROFILE_2_ROBINHOOD_MODE }}
      PROFILE_2_ROBINHOOD_LIVE_TRADING:     ${{ vars.PROFILE_2_ROBINHOOD_LIVE_TRADING }}

      # ── Profile 3 ───────────────────────────────────────────────────────────
      PROFILE_3_NAME:                    ${{ vars.PROFILE_3_NAME }}
      PROFILE_3_INDEX:                   ${{ vars.PROFILE_3_INDEX }}
      PROFILE_3_MAX_STOCKS:              ${{ vars.PROFILE_3_MAX_STOCKS }}
      PROFILE_3_SLACK_VALUE:             ${{ vars.PROFILE_3_SLACK_VALUE }}
      PROFILE_3_INITIAL_AMOUNT_PER_STOCK: ${{ vars.PROFILE_3_INITIAL_AMOUNT_PER_STOCK }}
      PROFILE_3_BROKER_TYPE:              ${{ vars.PROFILE_3_BROKER_TYPE }}
      PROFILE_3_TRADIER_TOKEN:           ${{ secrets.PROFILE_3_TRADIER_TOKEN }}
      PROFILE_3_TRADIER_ACCOUNT_ID:      ${{ secrets.PROFILE_3_TRADIER_ACCOUNT_ID }}
      PROFILE_3_ROBINHOOD_ACCOUNT_ID:       ${{ vars.PROFILE_3_ROBINHOOD_ACCOUNT_ID }}
      PROFILE_3_ROBINHOOD_MCP_URL:          ${{ vars.PROFILE_3_ROBINHOOD_MCP_URL }}
      PROFILE_3_ROBINHOOD_MODE:             ${{ vars.PROFILE_3_ROBINHOOD_MODE }}
      PROFILE_3_ROBINHOOD_LIVE_TRADING:     ${{ vars.PROFILE_3_ROBINHOOD_LIVE_TRADING }}

      # ── Profile 4 ───────────────────────────────────────────────────────────
      PROFILE_4_NAME:                    ${{ vars.PROFILE_4_NAME }}
      PROFILE_4_INDEX:                   ${{ vars.PROFILE_4_INDEX }}
      PROFILE_4_MAX_STOCKS:              ${{ vars.PROFILE_4_MAX_STOCKS }}
      PROFILE_4_SLACK_VALUE:             ${{ vars.PROFILE_4_SLACK_VALUE }}
      PROFILE_4_INITIAL_AMOUNT_PER_STOCK: ${{ vars.PROFILE_4_INITIAL_AMOUNT_PER_STOCK }}
      PROFILE_4_BROKER_TYPE:              ${{ vars.PROFILE_4_BROKER_TYPE }}
      PROFILE_4_TRADIER_TOKEN:           ${{ secrets.PROFILE_4_TRADIER_TOKEN }}
      PROFILE_4_TRADIER_ACCOUNT_ID:      ${{ secrets.PROFILE_4_TRADIER_ACCOUNT_ID }}
      PROFILE_4_ROBINHOOD_ACCOUNT_ID:       ${{ vars.PROFILE_4_ROBINHOOD_ACCOUNT_ID }}
      PROFILE_4_ROBINHOOD_MCP_URL:          ${{ vars.PROFILE_4_ROBINHOOD_MCP_URL }}
      PROFILE_4_ROBINHOOD_MODE:             ${{ vars.PROFILE_4_ROBINHOOD_MODE }}
      PROFILE_4_ROBINHOOD_LIVE_TRADING:     ${{ vars.PROFILE_4_ROBINHOOD_LIVE_TRADING }}

      # ── Profile 5 ───────────────────────────────────────────────────────────
      PROFILE_5_NAME:                    ${{ vars.PROFILE_5_NAME }}
      PROFILE_5_INDEX:                   ${{ vars.PROFILE_5_INDEX }}
      PROFILE_5_MAX_STOCKS:              ${{ vars.PROFILE_5_MAX_STOCKS }}
      PROFILE_5_SLACK_VALUE:             ${{ vars.PROFILE_5_SLACK_VALUE }}
      PROFILE_5_INITIAL_AMOUNT_PER_STOCK: ${{ vars.PROFILE_5_INITIAL_AMOUNT_PER_STOCK }}
      PROFILE_5_BROKER_TYPE:              ${{ vars.PROFILE_5_BROKER_TYPE }}
      PROFILE_5_TRADIER_TOKEN:           ${{ secrets.PROFILE_5_TRADIER_TOKEN }}
      PROFILE_5_TRADIER_ACCOUNT_ID:      ${{ secrets.PROFILE_5_TRADIER_ACCOUNT_ID }}
      PROFILE_5_ROBINHOOD_ACCOUNT_ID:       ${{ vars.PROFILE_5_ROBINHOOD_ACCOUNT_ID }}
      PROFILE_5_ROBINHOOD_MCP_URL:          ${{ vars.PROFILE_5_ROBINHOOD_MCP_URL }}
      PROFILE_5_ROBINHOOD_MODE:             ${{ vars.PROFILE_5_ROBINHOOD_MODE }}
      PROFILE_5_ROBINHOOD_LIVE_TRADING:     ${{ vars.PROFILE_5_ROBINHOOD_LIVE_TRADING }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Configure Robinhood OAuth state paths
        shell: bash
        run: |
          for profile in 1 2 3 4 5; do
            printf 'PROFILE_%s_ROBINHOOD_OAUTH_STATE_FILE=%s/robinhood-profile-%s.json\n' \
              "$profile" "$RUNNER_TEMP" "$profile"
          done >> "$GITHUB_ENV"

      - name: Run test suite
        run: go test ./... -count=1

      - name: Create Robinhood OAuth secret-writer token
        id: robinhood-app-token
        if: ${{ vars.ROBINHOOD_SECRET_WRITER_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.ROBINHOOD_SECRET_WRITER_APP_ID }}
          private-key: ${{ secrets.ROBINHOOD_SECRET_WRITER_PRIVATE_KEY }}
          permission-metadata: read
          permission-environments: write

      - name: Materialize Robinhood OAuth state
        shell: bash
        env:
          PROFILE_1_ROBINHOOD_OAUTH_STATE: ${{ secrets.PROFILE_1_ROBINHOOD_OAUTH_STATE }}
          PROFILE_2_ROBINHOOD_OAUTH_STATE: ${{ secrets.PROFILE_2_ROBINHOOD_OAUTH_STATE }}
          PROFILE_3_ROBINHOOD_OAUTH_STATE: ${{ secrets.PROFILE_3_ROBINHOOD_OAUTH_STATE }}
          PROFILE_4_ROBINHOOD_OAUTH_STATE: ${{ secrets.PROFILE_4_ROBINHOOD_OAUTH_STATE }}
          PROFILE_5_ROBINHOOD_OAUTH_STATE: ${{ secrets.PROFILE_5_ROBINHOOD_OAUTH_STATE }}
        run: |
          set -euo pipefail
          umask 077
          write_state() {
            local value="$1"
            local path="$2"
            if [[ -n "$value" ]]; then
              rm -f -- "$path"
              printf '%s' "$value" > "$path"
              chmod 600 "$path"
            fi
          }
          write_state "$PROFILE_1_ROBINHOOD_OAUTH_STATE" "$PROFILE_1_ROBINHOOD_OAUTH_STATE_FILE"
          write_state "$PROFILE_2_ROBINHOOD_OAUTH_STATE" "$PROFILE_2_ROBINHOOD_OAUTH_STATE_FILE"
          write_state "$PROFILE_3_ROBINHOOD_OAUTH_STATE" "$PROFILE_3_ROBINHOOD_OAUTH_STATE_FILE"
          write_state "$PROFILE_4_ROBINHOOD_OAUTH_STATE" "$PROFILE_4_ROBINHOOD_OAUTH_STATE_FILE"
          write_state "$PROFILE_5_ROBINHOOD_OAUTH_STATE" "$PROFILE_5_ROBINHOOD_OAUTH_STATE_FILE"

      - name: Build rebalancer binary
        run: go build -o rebalancer ./cmd/rebalancer

      - name: Rebalance all profiles
        env:
          GH_TOKEN: ${{ steps.robinhood-app-token.outputs.token }}
        run: ./rebalancer | tee /tmp/summary.txt

      - name: Remove Robinhood OAuth state
        if: always()
        shell: bash
        run: |
          for profile in 1 2 3 4 5; do
            rm -f -- "$RUNNER_TEMP/robinhood-profile-$profile.json"
          done

      - name: Post job summary
        if: always()
        run: |
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Send summary email
        if: always() && env.SMTP_SERVER != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: 587
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          to: ${{ env.NOTIFY_EMAIL }}
          from: GitHub Actions <${{ env.SMTP_USERNAME }}>
          subject: "[quant-stocks] Weekly Rebalance — ${{ github.run_number }}"
          body: file:///tmp/summary.txt
