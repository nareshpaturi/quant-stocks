name: Paper Trading Backtest

# ── How to use this workflow ───────────────────────────────────────────────────
#
# Trigger manually from Actions → Paper Trading Backtest → Run workflow.
# Fill in the inputs, click Run, and watch the job log for per-week details.
# A formatted summary is printed at the end of the "Run backtest" step.
#
# This workflow reads all configuration from the BACKTEST GitHub Environment.
# Go to Settings → Environments → New environment → name it "BACKTEST", then
# add the variables and secrets below inside that environment.
#
# VARIABLES — add under BACKTEST environment:
#   PROFILE_1_NAME, PROFILE_1_INDEX, PROFILE_1_MAX_STOCKS,
#   PROFILE_1_SLACK_VALUE, PROFILE_1_INITIAL_AMOUNT_PER_STOCK
#
# SECRETS — add under BACKTEST environment:
#   RANKING_API_TOKEN             QuantMyStocks API Bearer token
#   PROFILE_1_TRADIER_TOKEN       Tradier Bearer token for your SANDBOX account
#   PROFILE_1_TRADIER_ACCOUNT_ID  Tradier account number for your SANDBOX account
#
# The same variable names are used as in PROD, but the BACKTEST environment
# holds sandbox credentials so the two environments never interfere.
#
# The binary automatically routes to sandbox.tradier.com in backtest mode.
# Market must be open at trigger time for paper orders to execute.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      weeks:
        description: "Number of past Sundays to simulate (e.g. 12 = ~3 months)"
        required: true
        default: "12"
      delay_seconds:
        description: "Pause between weekly runs in seconds (default: 120)"
        required: false
        default: "120"

permissions:
  contents: read

jobs:
  backtest:
    name: Run paper trading backtest
    runs-on: ubuntu-latest
    # Upper bound: N weeks × delay + execution overhead.
    # GitHub Actions cap is 360 minutes; this supports up to ~150 weeks at
    # the default 120 s delay before the job times out.
    timeout-minutes: 360
    environment: BACKTEST

    env:
      # ── Backtest control ─────────────────────────────────────────────────────
      BACKTEST_MODE: "true"
      BACKTEST_WEEKS: ${{ inputs.weeks }}
      BACKTEST_DELAY_SECONDS: ${{ inputs.delay_seconds }}

      # ── All config read from the BACKTEST environment ─────────────────────────
      RANKING_API_TOKEN: ${{ secrets.RANKING_API_TOKEN }}

      PROFILE_COUNT: "1"
      PROFILE_1_NAME:                    ${{ vars.PROFILE_1_NAME }}
      PROFILE_1_INDEX:                   ${{ vars.PROFILE_1_INDEX }}
      PROFILE_1_MAX_STOCKS:              ${{ vars.PROFILE_1_MAX_STOCKS }}
      PROFILE_1_SLACK_VALUE:             ${{ vars.PROFILE_1_SLACK_VALUE }}
      PROFILE_1_INITIAL_AMOUNT_PER_STOCK: ${{ vars.PROFILE_1_INITIAL_AMOUNT_PER_STOCK }}
      # Sandbox Tradier credentials — stored in the BACKTEST environment,
      # not PROD, so live and paper accounts are fully isolated.
      PROFILE_1_TRADIER_TOKEN:           ${{ secrets.PROFILE_1_TRADIER_TOKEN }}
      PROFILE_1_TRADIER_ACCOUNT_ID:      ${{ secrets.PROFILE_1_TRADIER_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      # Domain tests gate the run — failures abort before any orders are placed.
      - name: Run domain unit tests
        run: go test ./internal/domain/... -v -count=1

      - name: Build rebalancer binary
        run: go build -o rebalancer ./cmd/rebalancer

      - name: Run backtest
        run: ./rebalancer
